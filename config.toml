# Zola configuration — https://www.getzola.org/documentation/getting-started/configuration/
base_url = "https://cyclefive.xyz"
title = "Cycle Five Syndicate"
description = "We make software we want to use. Rust-first, AI-assisted, human-centered."

default_language = "en"
compile_sass = true
# Off so the View Source compile banner (HTML comment in base.html) survives.
# Zola's minify-html path strips comments and does not expose keep_comments.
# Pages are a few KB; the size win is not worth erasing the artifact header.
minify_html = false
build_search_index = false
generate_feeds = true

[markdown]
smart_punctuation = true

# zola check validates external links by hitting them. Invite/chat links and
# bot-hostile hosts return non-200 to crawlers, so skip them to keep `zola check`
# deterministic in CI.
[link_checker]
skip_prefixes = [
    "https://discord.gg/",
    "https://t.me/",
    "https://cracktun.es",
]

[extra]
tagline = "We make software we want to use."
email = "hello@cyclefive.xyz"
discord_url = "https://discord.gg/b6KVpfH9CF"
telegram_url = "https://t.me/cracktunes"
copyright_year = 2026
repo_url = "https://github.com/cycle-five/cyclefive-site"
